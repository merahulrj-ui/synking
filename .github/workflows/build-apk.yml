name: Build Android Standalone APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧹 Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          df -h

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔧 Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 🚀 Compile Standalone Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx4096m -XX:MaxMetaspaceSize=1024m\""
        run: |
          cd android
          ./gradlew assembleRelease -x lint -x lintVitalRelease -x bundleReleaseLocalLintAar --no-daemon

      - name: 🏷️ Prepare Clean Synkin APK
        run: cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk Synkin.apk

      - name: 📲 Upload Synkin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Synkin-Release-APK
          path: Synkin.apk
          retention-days: 30
