name: Build Android Standalone APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔄 Generate Fresh Android Prebuild
        run: npx expo prebuild --platform android --clean

      - name: 🔧 Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 🚀 Compile Standalone Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx4096m -XX:MaxMetaspaceSize=1024m\""
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 📲 Upload Synking APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Synking-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
