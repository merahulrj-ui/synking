<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Synkin — Official Google Sign-In</title>
  <link rel="icon" href="/images/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #07050d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(253, 58, 115, 0.15);
      border-top-color: #FD3A73;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    h1 span {
      color: #FD3A73;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      max-width: 300px;
      line-height: 1.5;
    }
    .manual-link {
      margin-top: 24px;
      color: #FD3A73;
      text-decoration: underline;
      font-size: 14px;
      display: inline-block;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>Connecting to <span>Synkin</span></h1>
  <p>Redirecting to official Google Account selection...</p>
  <a id="manualLink" class="manual-link" href="#" style="display:none;">Tap here if not redirected automatically</a>

  <script>
    var CLIENT_ID = '816527505911-9aoc1h8930b42cpqi4eo8dlutk3ndcv9.apps.googleusercontent.com';
    var REDIRECT_URI = 'https://synkin.in/app';
    var oauthUrl = 'https://accounts.google.com/o/oauth2/v2/auth?' +
      'client_id=' + encodeURIComponent(CLIENT_ID) +
      '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) +
      '&response_type=token' +
      '&scope=' + encodeURIComponent('email profile openid') +
      '&prompt=select_account';

    document.getElementById('manualLink').href = oauthUrl;
    setTimeout(function() {
      document.getElementById('manualLink').style.display = 'inline-block';
    }, 2000);

    // Instant top-level redirect - cannot be blocked by popup blockers
    window.location.replace(oauthUrl);
  </script>
</body>
</html>
