<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Synkin — Google Sign-In</title>
  <link rel="icon" href="/images/favicon.png">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #07050d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 36px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
    }
    .logo-container {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, #FD3A73, #8E2DE2);
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(253, 58, 115, 0.35);
    }
    .logo-inner {
      background: #07050d;
      border-radius: 18px;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-inner img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    h1 span {
      color: #FD3A73;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      background: #ffffff;
      color: #1f2937;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 20px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      transition: all 0.2s ease;
    }
    .google-btn:active {
      transform: scale(0.98);
      background: #f1f5f9;
    }
    .google-icon {
      width: 20px;
      height: 20px;
    }
    .status-box {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      font-size: 14px;
      font-weight: 600;
    }
    .deep-link-btn {
      display: none;
      margin-top: 18px;
      background: linear-gradient(135deg, #FD3A73, #FF6584);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: 9999px;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(253, 58, 115, 0.4);
    }
    .footer-note {
      margin-top: 32px;
      font-size: 12px;
      color: #64748b;
    }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <div class="logo-inner">
        <img src="/images/logo_emblem.png" alt="Synkin Logo">
      </div>
    </div>
    <h1>Sign in to <span>Synkin</span></h1>
    <p>Tap below to select your Google Account and continue to Synkin.</p>

    <button id="googleBtn" class="google-btn" onclick="startGoogleAuth()">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <div id="statusBox" class="status-box"></div>
    <a id="deepLinkBtn" class="deep-link-btn" href="#">Open Synkin App 🚀</a>

    <div class="footer-note">
      Official Synkin OAuth 2.0 Security · End-to-end encrypted
    </div>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = '816527505911-9aoc1h8930b42cpqi4eo8dlutk3ndcv9.apps.googleusercontent.com';
    let tokenClient = null;

    function initClient() {
      if (window.google && window.google.accounts && window.google.accounts.oauth2) {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: 'email profile openid',
          callback: async function(tokenResponse) {
            if (tokenResponse && tokenResponse.access_token) {
              const statusBox = document.getElementById('statusBox');
              const deepLinkBtn = document.getElementById('deepLinkBtn');
              const googleBtn = document.getElementById('googleBtn');

              statusBox.style.display = 'block';
              statusBox.innerHTML = '<span class="spinner"></span> Verifying with Synkin...';
              googleBtn.style.display = 'none';

              try {
                const infoRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                  headers: { Authorization: 'Bearer ' + tokenResponse.access_token }
                });
                const profile = await infoRes.json();

                const res = await fetch('/api/auth/google', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    googleId: profile.sub,
                    email: profile.email,
                    name: profile.name || 'Google Member',
                    photo: profile.picture || ''
                  })
                });

                const data = await res.json();
                if (res.ok && data.success && data.user) {
                  statusBox.innerText = 'Welcome, ' + data.user.name + '! Opening Synkin...';
                  const deepUrl = 'synking://auth?user=' + encodeURIComponent(JSON.stringify(data.user));
                  deepLinkBtn.href = deepUrl;
                  deepLinkBtn.style.display = 'inline-block';

                  window.location.href = deepUrl;
                  setTimeout(function() {
                    deepLinkBtn.scrollIntoView({ behavior: 'smooth' });
                  }, 400);
                } else {
                  statusBox.innerText = 'Sign-in error: ' + (data.error || 'Server error');
                }
              } catch (err) {
                statusBox.innerText = 'Error: ' + err.message;
              }
            }
          }
        });
        return true;
      }
      return false;
    }

    function startGoogleAuth() {
      if (!tokenClient) {
        if (!initClient()) {
          alert('Google Services loading, please tap again in a moment...');
          return;
        }
      }
      tokenClient.requestAccessToken({ prompt: 'select_account' });
    }

    // Auto-trigger on page load
    window.addEventListener('load', function() {
      var checkInterval = setInterval(function() {
        if (initClient()) {
          clearInterval(checkInterval);
          setTimeout(function() {
            startGoogleAuth();
          }, 350);
        }
      }, 150);
    });
  </script>
</body>
</html>
