<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Synkin — Google Sign-In</title>
  <link rel="icon" href="/images/favicon.png">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #07050d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 36px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
    }
    .logo-container {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, #FD3A73, #8E2DE2);
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(253, 58, 115, 0.35);
    }
    .logo-inner {
      background: #07050d;
      border-radius: 18px;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-inner img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    h1 span {
      color: #FD3A73;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    #googleBtnContainer {
      display: flex;
      justify-content: center;
      min-height: 48px;
      margin-bottom: 20px;
    }
    .status-box {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      font-size: 14px;
      font-weight: 600;
    }
    .deep-link-btn {
      display: none;
      margin-top: 18px;
      background: linear-gradient(135deg, #FD3A73, #FF6584);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: 9999px;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(253, 58, 115, 0.4);
    }
    .footer-note {
      margin-top: 32px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <div class="logo-inner">
        <img src="/images/logo_emblem.png" alt="Synkin Logo">
      </div>
    </div>
    <h1>Sign in with <span>Google</span></h1>
    <p>Select your Google account below to securely verify and log in to Synkin.</p>

    <div id="googleBtnContainer">
      <div id="g_id_onload"
           data-client_id="816527505911-9aoc1h8930b42cpqi4eo8dlutk3ndcv9.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_prompt="true"
           data-cancel_on_tap_outside="false">
      </div>
      <div class="g_id_signin"
           data-type="standard"
           data-size="large"
           data-theme="filled_black"
           data-text="continue_with"
           data-shape="pill"
           data-logo_alignment="left"
           data-width="280">
      </div>
    </div>

    <div id="statusBox" class="status-box"></div>
    <a id="deepLinkBtn" class="deep-link-btn" href="#">Open Synkin App 🚀</a>

    <div class="footer-note">
      Protected with end-to-end encryption · Zero phone number leaks
    </div>
  </div>

  <script>
    function parseJwt(token) {
      try {
        var base64Url = token.split('.')[1];
        var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }

    async function handleCredentialResponse(response) {
      if (!response.credential) return;
      var statusBox = document.getElementById('statusBox');
      var deepLinkBtn = document.getElementById('deepLinkBtn');
      var btnContainer = document.getElementById('googleBtnContainer');

      statusBox.style.display = 'block';
      statusBox.innerText = 'Verifying your Google Account...';
      btnContainer.style.display = 'none';

      var profile = parseJwt(response.credential);
      if (!profile) {
        statusBox.innerText = 'Could not verify token. Please try again.';
        statusBox.style.background = 'rgba(239, 68, 68, 0.1)';
        statusBox.style.borderColor = 'rgba(239, 68, 68, 0.3)';
        statusBox.style.color = '#f87171';
        btnContainer.style.display = 'flex';
        return;
      }

      try {
        var res = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            googleId: profile.sub,
            email: profile.email,
            name: profile.name || 'Google Member',
            photo: profile.picture || ''
          })
        });

        var data = await res.json();
        if (res.ok && data.success && data.user) {
          statusBox.innerText = 'Welcome, ' + data.user.name + '! Redirecting to Synkin...';
          var deepUrl = 'synking://auth?user=' + encodeURIComponent(JSON.stringify(data.user));
          deepLinkBtn.href = deepUrl;
          deepLinkBtn.style.display = 'inline-block';

          // Automatically trigger deep link back to APK
          window.location.href = deepUrl;
          setTimeout(function() {
            deepLinkBtn.scrollIntoView({ behavior: 'smooth' });
          }, 400);
        } else {
          statusBox.innerText = 'Sign-in error: ' + (data.error || 'Server error');
        }
      } catch (err) {
        statusBox.innerText = 'Network error: ' + err.message;
      }
    }
  </script>
</body>
</html>
