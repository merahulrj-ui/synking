<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Synkin — Real-Time Dating & Verified Dates 🔥</title>
    <link rel="icon" href="/images/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/images/icon.png" />
    <meta name="theme-color" content="#000000" />
    <style id="expo-reset">
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #FFFFFF;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        display: flex;
        height: 100%;
        width: 100%;
        flex: 1;
        overflow: hidden;
      }
      /* On widescreen desktop, center mobile view cleanly */
      @media (min-width: 768px) {
        body {
          display: flex;
          align-items: center;
          justify-content: center;
          background: #0a0714 radial-gradient(circle at top center, rgba(253, 58, 115, 0.15), transparent 70%);
        }
        #root {
          max-width: 480px;
          height: 100vh;
          box-shadow: 0 0 60px rgba(0, 0, 0, 0.9), 0 0 20px rgba(253, 58, 115, 0.2);
          border-left: 1px solid rgba(255, 255, 255, 0.08);
          border-right: 1px solid rgba(255, 255, 255, 0.08);
        }
      }
    </style>
    <script>
      (function() {
        if (window.location.hash && window.location.hash.indexOf('access_token=') !== -1) {
          var hash = window.location.hash.substring(1);
          var params = new URLSearchParams(hash);
          var token = params.get('access_token');
          if (token) {
            window.addEventListener('DOMContentLoaded', function() {
              document.body.innerHTML = '<div style="background:#07050d;color:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;text-align:center;padding:24px;"><div style="width:44px;height:44px;border:3px solid rgba(253,58,115,0.2);border-top-color:#FD3A73;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:20px;"></div><h2 style="font-size:20px;font-weight:700;margin-bottom:8px;">Signing in to Synkin...</h2><p style="color:#94a3b8;font-size:14px;">Opening app...</p><a id="apkBtn" style="display:none;margin-top:20px;background:linear-gradient(135deg,#FD3A73,#FF6584);color:#fff;padding:14px 24px;border-radius:9999px;text-decoration:none;font-weight:700;" href="#">Open Synkin App 🚀</a></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style>';
            });
            fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
              headers: { Authorization: 'Bearer ' + token }
            })
            .then(function(r) { return r.json(); })
            .then(function(profile) {
              return fetch('/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  googleId: profile.sub,
                  email: profile.email,
                  name: profile.name || 'Google Member',
                  photo: profile.picture || ''
                })
              });
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
              if (data && data.success && data.user) {
                if (window.localStorage) {
                  window.localStorage.setItem('synking_my_user', JSON.stringify(data.user));
                }
                var deepUrl = 'synking://auth?user=' + encodeURIComponent(JSON.stringify(data.user));
                var btn = document.getElementById('apkBtn');
                if (btn) {
                  btn.href = deepUrl;
                  btn.style.display = 'inline-block';
                }
                window.location.href = deepUrl;
                setTimeout(function() {
                  window.location.replace('/app');
                }, 1500);
              }
            })
            .catch(function(err) {
              console.error('Google Auth Error:', err);
            });
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/_expo/static/js/web/index-auth-oled-v3.js?v=2026" defer></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </body>
</html>
